<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 162" role="img" aria-labelledby="title">
  <title id="title">中国象棋红黑棋子样式参考</title>
  <rect width="528" height="162" rx="12" fill="#F2E4C8"/>
  <defs>
    <g id="piece">
      <circle cy="2" r="27" fill="#D1BC9A"/>
      <circle r="27" fill="#FBF2DF" stroke="currentColor" stroke-width="1.3"/>
      <circle r="22.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
    </g>
  </defs>
  <g color="#952F29" fill="currentColor" font-family="'Noto Serif SC', SimSun, serif" font-size="28" font-weight="700" text-anchor="middle">
    <use href="#piece" x="48" y="45"/><text x="48" y="55">帅</text>
    <use href="#piece" x="120" y="45"/><text x="120" y="55">仕</text>
    <use href="#piece" x="192" y="45"/><text x="192" y="55">相</text>
    <use href="#piece" x="264" y="45"/><text x="264" y="55">马</text>
    <use href="#piece" x="336" y="45"/><text x="336" y="55">车</text>
    <use href="#piece" x="408" y="45"/><text x="408" y="55">炮</text>
    <use href="#piece" x="480" y="45"/><text x="480" y="55">兵</text>
  </g>
  <g color="#292726" fill="currentColor" font-family="'Noto Serif SC', SimSun, serif" font-size="28" font-weight="700" text-anchor="middle">
    <use href="#piece" x="48" y="117"/><text x="48" y="127">将</text>
    <use href="#piece" x="120" y="117"/><text x="120" y="127">士</text>
    <use href="#piece" x="192" y="117"/><text x="192" y="127">象</text>
    <use href="#piece" x="264" y="117"/><text x="264" y="127">马</text>
    <use href="#piece" x="336" y="117"/><text x="336" y="127">车</text>
    <use href="#piece" x="408" y="117"/><text x="408" y="127">炮</text>
    <use href="#piece" x="480" y="117"/><text x="480" y="127">卒</text>
  </g>
</svg>
